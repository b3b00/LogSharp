name: Build

on:
  workflow_dispatch:
  push:
    branches: 
      - dev
  pull_request:
    branches: 
      - dev
permissions:
  pull-requests: write
  checks: write
  contents: read
jobs:  
  build:
    env:
      TESTS_PROJECT: 'tests/LogsharpTests/LogsharpTests.csproj' # path to test project or solution
      PUBLISH_NUGET: false # if true a nuget will be published on version change
      RUN_TESTS: true # if true tests are run and coverage data is published to coveralls and a coverage report is produced.
      MAIN_CSPROJ: 'src/LogSharp/LogSharp.csproj' # main project (for nuget packaging)
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
          os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.x
    - name: Clean artifacts and nugets 
      run: dotnet clean  --configuration Release && dotnet nuget locals all --clear
    - name: Build with dotnet
      run: dotnet build --configuration Release
    - name: Test with dotnet
      uses: b3b00/coverlet-action@d4de331462c1706fd9f07b4b2a565f256fd95a23
      id: 'coverlet'
      if: env.RUN_TESTS
      with:
        testProject: ${{env.TESTS_PROJECT}}
        output: 'lcov.net10.0.info'
        threshold: 70
        outputFormat: 'lcov'
        excludes: '[LogSharpTester]*,[LogsharpTests]*'
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@3a74b2957438d0b6e2e61d67b05318aa25c9e6c6
      if: always()
      with:
        files: |
          **/*.trx
     - name: Generate coverage report
      if: env.RUN_TESTS
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
      with:
        reports: ${{ steps.coverlet.outputs.coverageFile }}
        targetdir: coveragereport
        reporttypes: 'Html;MarkdownSummaryGithub'
    - name: Add coverage summary
      shell: bash
      run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
    - name: Setup Pages
      if: env.RUN_TESTS
      uses: actions/configure-pages@v5
    - name: Upload coverage report for GitHub Pages
      if: env.RUN_TESTS
      uses: actions/upload-pages-artifact@v4
      with:
        path: coveragereport
